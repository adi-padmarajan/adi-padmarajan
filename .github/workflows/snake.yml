# Save this at: .github/workflows/snake.yml
# Generates the contribution-snake animation the README points at.
# First run: Actions tab → "Generate Snake" → Run workflow.

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # lets you trigger it manually
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake images
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: adi-padmarajan
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#FF8A3D
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF8A3D

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
