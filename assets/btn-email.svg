<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 104" width="340" height="104" role="img" aria-label="EMAIL — aditya.padmarajan@gmail.com">
  <title>EMAIL &#8212; aditya.padmarajan@gmail.com</title>
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#061A3A"/>
      <stop offset="100%" stop-color="#01040B"/>
    </linearGradient>
    <radialGradient id="cwell" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#38E1FF" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#38E1FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cedge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#38E1FF"  stop-opacity=".32"/>
      <stop offset="100%" stop-color="#8B6CFF" stop-opacity=".32"/>
    </linearGradient>
    <clipPath id="cf"><rect width="340" height="104" rx="6"/></clipPath>
  </defs>
  <style>
    .lb { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:15px; font-weight:700; letter-spacing:2.6px; fill:#DCEBFF; }
    .tg { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:10.5px; letter-spacing:.9px; fill:#5873A0; }
    .ch { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:9.5px; letter-spacing:2.4px; fill:#5873A0; }
    .ar { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:19px; font-weight:700; fill:#38E1FF; animation:ar 2.6s ease-in-out infinite; }
    @keyframes ar { 0%,100% {transform:translateX(0);opacity:.55} 50% {transform:translateX(4px);opacity:1} }
    .dt { animation:dt 2.4s ease-in-out infinite; }
    @keyframes dt { 0%,100% {opacity:.25} 50% {opacity:1} }
    .ring { fill:none; stroke:#38E1FF; stroke-width:1; vector-effect:non-scaling-stroke;
             transform-origin:38px 52px; animation:ring 3.6s ease-out infinite; }
    @keyframes ring { 0% {transform:scale(.55);opacity:.8} 100% {transform:scale(2.2);opacity:0} }
    .snow { fill:#DCEBFF; animation:sink linear infinite; }
    @keyframes sink { from {transform:translate(0,0)} to {transform:translate(-14px,114px)} }
    @media (prefers-reduced-motion: reduce) {
      .ar,.dt,.ring,.snow { animation:none; }
      .ring { opacity:0 }
    }
  </style>

  <g clip-path="url(#cf)">
    <rect width="340" height="104" fill="url(#cbg)"/>
    <circle class="snow" cx="269" cy="-4" r="0.7" fill-opacity="0.18" style="animation-duration:12.0s;animation-delay:-1.0s"/>
    <circle class="snow" cx="65" cy="-4" r="0.5" fill-opacity="0.23" style="animation-duration:10.6s;animation-delay:-10.4s"/>
    <circle class="snow" cx="57" cy="-4" r="0.6" fill-opacity="0.17" style="animation-duration:9.7s;animation-delay:-8.2s"/>
    <circle class="snow" cx="258" cy="-4" r="0.5" fill-opacity="0.25" style="animation-duration:17.8s;animation-delay:-9.4s"/>
    <circle class="snow" cx="255" cy="-4" r="0.7" fill-opacity="0.16" style="animation-duration:16.1s;animation-delay:-3.7s"/>
    <circle class="snow" cx="239" cy="-4" r="0.9" fill-opacity="0.29" style="animation-duration:18.5s;animation-delay:-16.0s"/>
    <circle class="snow" cx="58" cy="-4" r="1.1" fill-opacity="0.30" style="animation-duration:21.1s;animation-delay:-14.3s"/>
    <circle class="snow" cx="239" cy="-4" r="0.4" fill-opacity="0.15" style="animation-duration:15.9s;animation-delay:-8.0s"/>
    <circle class="snow" cx="274" cy="-4" r="0.6" fill-opacity="0.23" style="animation-duration:20.3s;animation-delay:-19.5s"/>
    <circle class="snow" cx="240" cy="-4" r="0.6" fill-opacity="0.19" style="animation-duration:14.2s;animation-delay:-9.2s"/>

    <!-- channel tag -->
    <text class="ch" x="308" y="24" text-anchor="end">BEACON.03</text>
    <circle class="dt" cx="320" cy="20" r="3.2" fill="#38E1FF" style="animation-delay:-1.6s"/>

    <!-- beacon: icon with sonar rings going out from it -->
    <circle cx="38" cy="52" r="30" fill="url(#cwell)"/>
    <circle class="ring" cx="38" cy="52" r="20" style="animation-delay:-2.4s"/>
    <circle class="ring" cx="38" cy="52" r="20" style="animation-delay:-4.2s"/>
    <circle cx="38" cy="52" r="18" fill="#01040B" stroke="#38E1FF" stroke-opacity=".32"/>
    <g transform="translate(29,43)" stroke="#38E1FF" stroke-width="1.3" fill="none" stroke-linecap="round"><rect x="1" y="3" width="16" height="12" rx="1.5"/><path d="M1.6 4.2 9 10l7.4-5.8"/></g>

    <!-- label + target -->
    <text class="lb" x="76" y="50">EMAIL</text>
    <text class="tg" x="76" y="68">aditya.padmarajan@gmail.com</text>

    <!-- enter arrow -->
    <text class="ar" x="318" y="65" text-anchor="end">&#8250;</text>

    <rect x=".5" y=".5" width="339" height="103" rx="6" fill="none" stroke="url(#cedge)"/>
  </g>
</svg>
