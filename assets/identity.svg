    @keyframes icar { 0%,50% {opacity:1} 51%,100% {opacity:0} }
    .sweep { transform-origin:735px 153.0px; animation:spin 4s linear infinite; }
    @keyframes spin { to {transform:rotate(360deg)} }
    .blip { animation:blip 4s linear infinite; }
    @keyframes blip { 0%,11.1% {opacity:.2} 11.9% {opacity:1} 70%,100% {opacity:.2} }
    .echo { fill:none; stroke:#38E1FF; stroke-width:1; vector-effect:non-scaling-stroke;
             transform-origin:761px 122.0px; animation:echo 4s ease-out infinite; }
    @keyframes echo {
      0%,11.1% {transform:scale(.3);opacity:0}
      11.9% {transform:scale(.3);opacity:.9}
      41.1%,100% {transform:scale(2.4);opacity:0}
    }
    .dot { animation:ipulse 2.2s ease-in-out infinite; }
    @keyframes ipulse { 0%,100% {opacity:.25} 50% {opacity:1} }
    .snow { fill:#DCEBFF; animation:sink linear infinite; }
    @keyframes sink { from {transform:translate(0,0)} to {transform:translate(-14px,300px)} }
    @media (prefers-reduced-motion: reduce) {
      .car,.sweep,.blip,.echo,.dot,.snow { animation:none; }
      .echo { opacity:0 }
    }
  </style>

