<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 22" width="1000" height="22" role="presentation">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF8A3D" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#FF8A3D" stop-opacity=".55"/>
      <stop offset="82%"  stop-color="#22D3EE"   stop-opacity=".55"/>
      <stop offset="100%" stop-color="#22D3EE"   stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .pkt { animation:run 4.5s linear infinite; }
    .pkt2 { animation:run 4.5s linear infinite; animation-delay:-2.25s; }
    @keyframes run { from { transform:translateX(-40px); } to { transform:translateX(1040px); } }
    @media (prefers-reduced-motion: reduce) { .pkt,.pkt2 { animation:none; opacity:.4 } }
  </style>
  <line x1="0" y1="11" x2="1000" y2="11" stroke="url(#dl)" stroke-width="1.2"/>
  <g class="pkt"><rect x="0" y="9" width="34" height="3" rx="1.5" fill="#FF8A3D" fill-opacity=".85"/></g>
  <g class="pkt2"><rect x="0" y="9" width="18" height="3" rx="1.5" fill="#22D3EE" fill-opacity=".7"/></g>
  <rect x="499" y="6" width="2" height="10" fill="#FF8A3D" fill-opacity=".5"/>
</svg>
