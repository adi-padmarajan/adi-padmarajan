<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 128" width="340" height="128" role="img" aria-label="Portfolio — adityapadmarajan.com">
  <title>Portfolio — adityapadmarajan.com</title>
  <defs>
    <linearGradient id="bg0" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0"  stop-color="#2B2A4C"/>
      <stop offset=".6" stop-color="#4A3A5E"/>
      <stop offset="1"  stop-color="#B9746A"/>
    </linearGradient>
    <radialGradient id="glow0" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFD39A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFD39A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#1E1C36" stop-opacity=".92"/>
      <stop offset=".5"  stop-color="#1E1C36" stop-opacity=".55"/>
      <stop offset=".75" stop-color="#1E1C36" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cc0"><rect width="340" height="128" rx="14"/></clipPath>
  </defs>
  <style>
    .tg { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:9.5px; letter-spacing:2.6px; fill:#F4C27A; }
    .ds { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:9.5px; letter-spacing:1.6px; fill:#FFF4E2; fill-opacity:.5; }
    .lb { font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif; font-size:30px; fill:#FFF4E2; letter-spacing:-.3px; }
    .tx { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:11.5px; letter-spacing:.3px; fill:#A9C4AA; }
    .ar { animation:ar 2.6s ease-in-out infinite; }
    @keyframes ar { 0%,100% { transform:translate(0,0); } 50% { transform:translate(2px,-2px); } }
    .sunp { transform-box:fill-box; transform-origin:center; animation:sunp 5s ease-in-out infinite; }
    @keyframes sunp { 0%,100% { transform:scale(1); opacity:.7; } 50% { transform:scale(1.2); opacity:1; } }
    .sw { transform-box:fill-box; transform-origin:50% 100%; animation:sw 5s ease-in-out infinite alternate; }
    @keyframes sw { from { transform:rotate(-1.4deg); } to { transform:rotate(1.4deg); } }
    .fogc { animation:fogc 12s ease-in-out infinite alternate; }
    @keyframes fogc { from { transform:translateX(-30px); } to { transform:translateX(30px); } }
    .wave { animation:wave linear infinite; }
    @keyframes wave { from { transform:translateX(0); } to { transform:translateX(40px); } }
    .boat { transform-box:fill-box; transform-origin:50% 100%; animation:boat 4s ease-in-out infinite; }
    @keyframes boat { 0%,100% { transform:translateY(0) rotate(-3deg); } 50% { transform:translateY(3px) rotate(3deg); } }
    .mote { animation:mote ease-in-out infinite; }
    @keyframes mote {
      0%   { transform:translate(0,0);      opacity:0; }
      20%  { opacity:.9; }
      50%  { transform:translate(9px,-14px); opacity:.35; }
      80%  { opacity:.85; }
      100% { transform:translate(-4px,-30px); opacity:0; }
    }
    @media (prefers-reduced-motion: reduce) { .ar,.sunp,.sw,.fogc,.wave,.boat,.mote { animation:none !important; } .mote { opacity:0; } }
  </style>
  <g clip-path="url(#cc0)">
    <rect width="340" height="128" fill="url(#bg0)"/>
    
    <circle class="sunp" cx="300" cy="46" r="34" fill="url(#glow0)"/>
    <circle cx="300" cy="46" r="13" fill="#FFE2AE"/>
    <path d="M110 128 L190 86 L214 98 L250 80 L300 104 L360 92 L360 128Z" fill="#6A5478" fill-opacity=".7"/>
    <path d="M150 128 L222 70 L246 84 L272 40 L300 66 L318 58 L360 128Z" fill="#2C2840"/>
    <path d="M272 40 L262 58 L268 55 L274 62 L281 54 L289 60 L300 66 Z" fill="#F7E5EA"/>
    <path d="M272 40 v-16" stroke="#FFF4E2" stroke-width="1"/>
    <path fill="#F28B4C"><animate attributeName="d" dur="1.2s" repeatCount="indefinite"
      values="M272 24 q5 1 10 0 q-1 3 0 6 q-5 1 -10 0z;M272 24 q5 -2 10 1 q-1 3 0 6 q-5 -2 -10 -1z;M272 24 q5 1 10 0 q-1 3 0 6 q-5 1 -10 0z"/></path>
    <circle class="mote" cx="241.7" cy="20.1" r="0.7" fill="#FFE2AE" style="animation-duration:12.4s;animation-delay:-10.2s"/><circle class="mote" cx="277" cy="34.6" r="0.8" fill="#FFE2AE" style="animation-duration:10.8s;animation-delay:-4.0s"/><circle class="mote" cx="227" cy="28.5" r="1" fill="#FFE2AE" style="animation-duration:8.2s;animation-delay:-4.1s"/><circle class="mote" cx="305.8" cy="82.1" r="0.7" fill="#FFE2AE" style="animation-duration:11.6s;animation-delay:-10.3s"/><circle class="mote" cx="333.6" cy="44.7" r="0.7" fill="#FFE2AE" style="animation-duration:12.0s;animation-delay:-0.8s"/><circle class="mote" cx="283.6" cy="92.8" r="0.7" fill="#FFE2AE" style="animation-duration:14.2s;animation-delay:-13.1s"/><circle class="mote" cx="312.1" cy="23.1" r="1" fill="#FFE2AE" style="animation-duration:13.8s;animation-delay:-13.1s"/><circle class="mote" cx="256.6" cy="75.6" r="0.7" fill="#FFE2AE" style="animation-duration:13.6s;animation-delay:-2.7s"/>
    <rect width="340" height="128" fill="url(#scrim0)"/>

    <text class="tg" x="24" y="32">TRAIL 01</text>
    <text class="ds" x="24" y="32" dx="75">· SUMMIT</text>
    <text class="lb" x="22" y="78">Portfolio</text>
    <text class="tx" x="24" y="102">adityapadmarajan.com</text>

    <g class="ar">
      <circle cx="312" cy="28" r="12" fill="#000" fill-opacity=".18" stroke="#FFF4E2" stroke-opacity=".45"/>
      <path d="M308 32 l8 -8 M310 24 h6 v6" fill="none" stroke="#FFF4E2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x=".5" y=".5" width="339" height="127" rx="14" fill="none" stroke="#FFF4E2" stroke-opacity=".2"/>
  </g>
</svg>
