<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Aditya Padmarajan — Software Developer">
  <title>Aditya Padmarajan — Software Developer</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#07090C"/>
      <stop offset="58%"  stop-color="#0C1016"/>
      <stop offset="100%" stop-color="#160D07"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="66%" r="46%">
      <stop offset="0%"   stop-color="#FF8A3D" stop-opacity="0.40"/>
      <stop offset="45%"  stop-color="#C2410C"  stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#C2410C"  stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask"><rect x="0" y="230" width="1200" height="130" fill="url(#gridfade)"/></mask>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#22D3EE" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#000" fill-opacity="0.30"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="360" rx="3"/></clipPath>
  </defs>

  <style>
    .rain { stroke:#22D3EE; stroke-width:1.1; animation-name:fall; animation-timing-function:linear; animation-iteration-count:infinite; }
    @keyframes fall { from { transform:translateY(0); } to { transform:translateY(420px); } }

    .grid { stroke:#FF8A3D; stroke-width:0.8; stroke-opacity:0.26; }
    .gridh { stroke:#FF8A3D; stroke-width:0.8; animation:creep 5.5s linear infinite; }
    @keyframes creep { from { transform:translateY(0); } to { transform:translateY(26px); } }

    .name  { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:60px; font-weight:700; letter-spacing:7px; }
    .g1 { fill:#22D3EE;   animation:gl1 6.5s steps(1) infinite; }
    .g2 { fill:#FF2E88; animation:gl2 6.5s steps(1) infinite; }
    @keyframes gl1 {
      0%,6%,100% { opacity:0; transform:translate(0,0); }
      7%  { opacity:.85; transform:translate(-4px,1px); }
      9%  { opacity:0; }
      41% { opacity:.7;  transform:translate(3px,-2px); }
      43% { opacity:0; }
    }
    @keyframes gl2 {
      0%,6%,100% { opacity:0; transform:translate(0,0); }
      7.5%{ opacity:.7;  transform:translate(4px,-1px); }
      9.5%{ opacity:0; }
      41.5%{opacity:.6;  transform:translate(-3px,2px); }
      43.5%{opacity:0; }
    }
    .slice { animation:slice 6.5s steps(1) infinite; }
    @keyframes slice {
      0%,7%,100% { transform:translateX(0); }
      7.5% { transform:translateX(13px); }
      8.5% { transform:translateX(-7px); }
      9.5% { transform:translateX(0); }
      42%  { transform:translateX(-9px); }
      43%  { transform:translateX(0); }
    }

    .eyebrow { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:13px; letter-spacing:5.5px; fill:#FF8A3D; fill-opacity:.9; }
    .sub     { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:15.5px; letter-spacing:1.2px; fill:#5A6672; }
    .subhi   { fill:#E8E3D9; }
    .meta    { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:11px; letter-spacing:2.4px; fill:#5A6672; fill-opacity:.75; }

    .cursor { fill:#FF8A3D; animation:blink 1.05s steps(1) infinite; }
    @keyframes blink { 0%,50% {opacity:1} 51%,100% {opacity:0} }

    .sweepbar { animation:sweep 7s cubic-bezier(.4,0,.6,1) infinite; }
    @keyframes sweep { 0% {transform:translateY(-90px)} 100% {transform:translateY(400px)} }

    .hud { stroke:#FF8A3D; stroke-width:1.4; fill:none; stroke-opacity:.55; }
    .pulse { animation:pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% {opacity:.35} 50% {opacity:1} }

    @media (prefers-reduced-motion: reduce) {
      .rain,.gridh,.g1,.g2,.slice,.cursor,.sweepbar,.pulse { animation:none; }
      .g1,.g2 { opacity:0; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#sky)"/>
    <rect width="1200" height="360" fill="url(#sun)"/>

