    <path d="M862 196 L870 160 L886 160 L896 194Z" fill="#050F24" stroke="#132A4F"/>

    <!-- seabed -->
    <path d="M0 206 C120 188 220 202 340 194 C470 184 560 206 700 198 C820 191 900 204 1000 192 L1000 240 L0 240Z" fill="#020815" stroke="#132A4F"/>

    <!-- anglerfish -->
