    <g class="eye" style="animation-delay:-1.5s"><circle cx="930" cy="56" r="1.4" fill="#8B6CFF"/><circle cx="935" cy="56" r="1.4" fill="#8B6CFF"/></g>
    <g class="eye" style="animation-delay:-2.3s"><circle cx="820" cy="118" r="1.4" fill="#8B6CFF"/><circle cx="825" cy="118" r="1.4" fill="#8B6CFF"/></g>
