    <!-- sign-off -->
    <text class="big" x="610" y="96" text-anchor="middle">10,935<tspan font-size="18" fill="#5873A0" dx="8">m</tspan></text>
    <text class="zn" x="610" y="122" text-anchor="middle">HADAL ZONE &#183; CHALLENGER DEEP</text>
    <text class="nt" x="610" y="146" text-anchor="middle">you've reached the bottom. thanks for diving.</text>
    <g class="rise">
      <path d="M604 176 l6 -6 l6 6" fill="none" stroke="#38E1FF" stroke-width="1.4"/>
      <text class="up" x="610" y="192" text-anchor="middle">RESURFACE</text>
    </g>

    <rect x=".5" y=".5" width="999" height="239" rx="6" fill="none" stroke="#132A4F"/>
