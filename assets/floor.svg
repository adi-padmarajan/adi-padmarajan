    <circle class="snow" cx="565" cy="-4" r="0.9" fill-opacity="0.18" style="animation-duration:12.2s;animation-delay:-11.5s"/>
    <circle class="snow" cx="692" cy="-4" r="1.0" fill-opacity="0.21" style="animation-duration:16.6s;animation-delay:-6.9s"/>
    <circle class="snow" cx="787" cy="-4" r="0.4" fill-opacity="0.23" style="animation-duration:20.3s;animation-delay:-17.5s"/>
