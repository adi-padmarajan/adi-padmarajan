<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="10,935 metres, Challenger Deep. You've reached the bottom. Click to resurface.">
  <title>10,935 m &#183; you've reached the bottom</title>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#030B1C"/>
      <stop offset="100%" stop-color="#01040B"/>
    </linearGradient>
    <radialGradient id="lure" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#38E1FF" stop-opacity=".30"/>
      <stop offset="45%"  stop-color="#38E1FF" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#38E1FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vent" cx="50%" cy="100%" r="80%">
      <stop offset="0%"   stop-color="#8B6CFF" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#8B6CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="fglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ff"><rect width="1000" height="240" rx="6"/></clipPath>
  </defs>
  <style>
    .big { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:40px; font-weight:700; letter-spacing:4px; fill:#38E1FF; }
    .zn  { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:12px; font-weight:700; letter-spacing:4px; fill:#DCEBFF; }
    .nt  { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:12px; font-style:italic; fill:#5873A0; }
    .up  { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:10.5px; letter-spacing:3px; fill:#38E1FF; }
    .eye { animation:eye 11s ease-in-out infinite; }
    @keyframes eye { 0%,62%,100% {opacity:0} 66%,80% {opacity:.9} 81% {opacity:0} 82%,86% {opacity:.9} }
    .fish { animation:swim 10s ease-in-out infinite; }
    @keyframes swim { 0%,100% {transform:translate(0,0)} 50% {transform:translate(14px,-6px)} }
    .rod { transform-origin:322px 90px; animation:bob 3.6s ease-in-out infinite alternate; }
    @keyframes bob { from {transform:rotate(-4deg)} to {transform:rotate(5deg)} }
    .halo { animation:halo 3.6s ease-in-out infinite; }
    @keyframes halo { 0%,100% {opacity:.7} 50% {opacity:1} }
    .rise { animation:upcue 2.2s ease-in-out infinite; }
    @keyframes upcue { 0%,100% {transform:translateY(0);opacity:.55} 50% {transform:translateY(-4px);opacity:1} }
    .snow { fill:#DCEBFF; animation:sink linear infinite; }
    @keyframes sink { from {transform:translate(0,0)} to {transform:translate(-14px,250px)} }
    .bub { fill:none; stroke:#38E1FF; stroke-width:1; stroke-opacity:.55; animation:rise ease-in infinite; }
    @keyframes rise {
      0%   { transform:translate(0,0); opacity:0; }
      12%  { opacity:1; }
      50%  { transform:translate(5px,-75px); }
      88%  { opacity:.8; }
      100% { transform:translate(-3px,-150px); opacity:0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .eye,.fish,.rod,.halo,.rise,.snow,.bub { animation:none; }
      .eye { opacity:.6 } .bub { opacity:0 }
    }
  </style>

  <g clip-path="url(#ff)">
    <rect width="1000" height="240" fill="url(#fbg)"/>
