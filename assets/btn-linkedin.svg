<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 104" width="340" height="104" role="img" aria-label="LINKEDIN — in/aditya-padmarajan">
  <title>LINKEDIN &#8212; in/aditya-padmarajan</title>
  <defs>
    <linearGradient id="bg31" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0D131A"/>
      <stop offset="64%"  stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#07090C"/>
    </linearGradient>
    <linearGradient id="rule31" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF8A3D" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#FF8A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="swp31" x1="0" y1="0" x2="0" y2="1">
