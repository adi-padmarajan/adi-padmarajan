      <stop offset="50%"  stop-color="#22D3EE" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="sc31" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#000" fill-opacity="0.26"/>
    </pattern>
    <clipPath id="fr31"><rect width="340" height="104" rx="3"/></clipPath>
  </defs>
  <style>
    .lb31 { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:15px; font-weight:700; letter-spacing:2.6px; fill:#E8E3D9; }
    .tg31 { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:10.5px; letter-spacing:.9px; fill:#5A6672; }
    .ch31 { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:9.5px; letter-spacing:2.4px; fill:#5A6672; fill-opacity:.8; }
    .ar31 { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:19px; font-weight:700; fill:#FF8A3D; animation:ar31 2.6s ease-in-out infinite; }
    @keyframes ar31 { 0%,100% {transform:translateX(0);opacity:.55} 50% {transform:translateX(4px);opacity:1} }
    .dt31 { animation:dt31 2.4s ease-in-out infinite; }
    @keyframes dt31 { 0%,100% {opacity:.25} 50% {opacity:1} }
    .rn31 { stroke:#22D3EE; stroke-width:1; animation-name:fl31; animation-timing-function:linear; animation-iteration-count:infinite; }
    @keyframes fl31 { from {transform:translateY(0)} to {transform:translateY(134px)} }
    .sw31 { animation:sw31 9s ease-in-out infinite; animation-delay:-3s; }
    @keyframes sw31 { 0%,100% {transform:translateY(-60px)} 50% {transform:translateY(104px)} }
    .bar31 { animation:bar31 5s ease-in-out infinite; animation-delay:-1s; }
    @keyframes bar31 { 0%,100% {opacity:.35} 50% {opacity:.95} }
    @media (prefers-reduced-motion: reduce) {
      .ar31,.dt31,.rn31,.sw31,.bar31 { animation:none; }
      .rn31 { opacity:.16 }
    }
  </style>

  <g clip-path="url(#fr31)">
