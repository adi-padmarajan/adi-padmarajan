<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 104" width="340" height="104" role="img" aria-label="LINKEDIN — in/aditya-padmarajan">
  <title>LINKEDIN &#8212; in/aditya-padmarajan</title>
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#061A3A"/>
      <stop offset="100%" stop-color="#01040B"/>
    </linearGradient>
    <radialGradient id="cwell" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#38E1FF" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#38E1FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cedge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#38E1FF"  stop-opacity=".32"/>
      <stop offset="100%" stop-color="#8B6CFF" stop-opacity=".32"/>
    </linearGradient>
    <clipPath id="cf"><rect width="340" height="104" rx="6"/></clipPath>
  </defs>
  <style>
    .lb { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:15px; font-weight:700; letter-spacing:2.6px; fill:#DCEBFF; }
    .tg { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:10.5px; letter-spacing:.9px; fill:#5873A0; }
    .ch { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:9.5px; letter-spacing:2.4px; fill:#5873A0; }
    .ar { font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:19px; font-weight:700; fill:#38E1FF; animation:ar 2.6s ease-in-out infinite; }
    @keyframes ar { 0%,100% {transform:translateX(0);opacity:.55} 50% {transform:translateX(4px);opacity:1} }
    .dt { animation:dt 2.4s ease-in-out infinite; }
    @keyframes dt { 0%,100% {opacity:.25} 50% {opacity:1} }
    .ring { fill:none; stroke:#38E1FF; stroke-width:1; vector-effect:non-scaling-stroke;
             transform-origin:38px 52px; animation:ring 3.6s ease-out infinite; }
    @keyframes ring { 0% {transform:scale(.55);opacity:.8} 100% {transform:scale(2.2);opacity:0} }
    .snow { fill:#DCEBFF; animation:sink linear infinite; }
    @keyframes sink { from {transform:translate(0,0)} to {transform:translate(-14px,114px)} }
    @media (prefers-reduced-motion: reduce) {
      .ar,.dt,.ring,.snow { animation:none; }
      .ring { opacity:0 }
    }
  </style>

  <g clip-path="url(#cf)">
    <rect width="340" height="104" fill="url(#cbg)"/>
    <circle class="snow" cx="130" cy="-4" r="1.0" fill-opacity="0.15" style="animation-duration:14.2s;animation-delay:-9.4s"/>
    <circle class="snow" cx="7" cy="-4" r="0.9" fill-opacity="0.24" style="animation-duration:11.2s;animation-delay:-0.6s"/>
    <circle class="snow" cx="175" cy="-4" r="0.5" fill-opacity="0.20" style="animation-duration:19.7s;animation-delay:-13.9s"/>
    <circle class="snow" cx="164" cy="-4" r="0.4" fill-opacity="0.23" style="animation-duration:9.5s;animation-delay:-6.1s"/>
    <circle class="snow" cx="170" cy="-4" r="0.8" fill-opacity="0.19" style="animation-duration:9.0s;animation-delay:-6.4s"/>
    <circle class="snow" cx="28" cy="-4" r="1.0" fill-opacity="0.20" style="animation-duration:11.1s;animation-delay:-9.0s"/>
    <circle class="snow" cx="24" cy="-4" r="0.6" fill-opacity="0.26" style="animation-duration:13.9s;animation-delay:-10.2s"/>
    <circle class="snow" cx="193" cy="-4" r="0.9" fill-opacity="0.27" style="animation-duration:21.0s;animation-delay:-9.8s"/>
    <circle class="snow" cx="108" cy="-4" r="0.9" fill-opacity="0.33" style="animation-duration:14.4s;animation-delay:-10.2s"/>
    <circle class="snow" cx="159" cy="-4" r="1.1" fill-opacity="0.34" style="animation-duration:21.3s;animation-delay:-16.8s"/>

    <!-- channel tag -->
    <text class="ch" x="308" y="24" text-anchor="end">BEACON.02</text>
    <circle class="dt" cx="320" cy="20" r="3.2" fill="#38E1FF" style="animation-delay:-0.8s"/>

    <!-- beacon: icon with sonar rings going out from it -->
    <circle cx="38" cy="52" r="30" fill="url(#cwell)"/>
    <circle class="ring" cx="38" cy="52" r="20" style="animation-delay:-1.2s"/>
    <circle class="ring" cx="38" cy="52" r="20" style="animation-delay:-3.0s"/>
    <circle cx="38" cy="52" r="18" fill="#01040B" stroke="#38E1FF" stroke-opacity=".32"/>
    <g transform="translate(29,43)" stroke="#38E1FF" stroke-width="1.3" fill="none" stroke-linecap="round"><path d="M7 11a4 4 0 0 0 5.7 0l2.6-2.6a4 4 0 1 0-5.7-5.7L8.2 4"/><path d="M11 7a4 4 0 0 0-5.7 0L2.7 9.6a4 4 0 1 0 5.7 5.7L9.8 14"/></g>

    <!-- label + target -->
    <text class="lb" x="76" y="50">LINKEDIN</text>
    <text class="tg" x="76" y="68">in/aditya-padmarajan</text>

    <!-- enter arrow -->
    <text class="ar" x="318" y="65" text-anchor="end">&#8250;</text>

    <rect x=".5" y=".5" width="339" height="103" rx="6" fill="none" stroke="url(#cedge)"/>
  </g>
</svg>
