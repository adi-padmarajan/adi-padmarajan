    <rect width="340" height="104" fill="#FF8A3D" fill-opacity=".03"/>
    <line class="rn31" x1="98" y1="-23" x2="93" y2="0" stroke-opacity="0.08" style="animation-duration:1.56s;animation-delay:-2.02s"/>
    <line class="rn31" x1="33" y1="-21" x2="28" y2="0" stroke-opacity="0.08" style="animation-duration:1.87s;animation-delay:-0.99s"/>
    <line class="rn31" x1="242" y1="-24" x2="237" y2="0" stroke-opacity="0.13" style="animation-duration:1.99s;animation-delay:-0.54s"/>
    <line class="rn31" x1="299" y1="-20" x2="294" y2="0" stroke-opacity="0.11" style="animation-duration:2.29s;animation-delay:-1.71s"/>
    <line class="rn31" x1="41" y1="-23" x2="36" y2="0" stroke-opacity="0.07" style="animation-duration:2.05s;animation-delay:-1.46s"/>
    <line class="rn31" x1="208" y1="-22" x2="203" y2="0" stroke-opacity="0.11" style="animation-duration:1.57s;animation-delay:-0.29s"/>
    <line class="rn31" x1="86" y1="-14" x2="81" y2="0" stroke-opacity="0.07" style="animation-duration:1.80s;animation-delay:-0.34s"/>

    <!-- accent rail + bottom rule -->
    <rect class="bar31" x="0" y="0" width="3" height="104" fill="#FF8A3D"/>
    <rect x="0" y="103" width="340" height="1" fill="url(#rule31)"/>

    <!-- channel tag -->
    <text class="ch31" x="308" y="26" text-anchor="end">CH.02</text>
    <circle class="dt31" cx="320" cy="22" r="3.2" fill="#FF8A3D"/>

    <!-- icon well -->
    <rect x="20" y="34" width="36" height="36" rx="3"
          fill="#07090C" stroke="#FF8A3D" stroke-opacity=".30"/>
    <g transform="translate(29,43)"
       stroke="#22D3EE" stroke-width="1.3" fill="none" stroke-linecap="round"><path d="M7 11a4 4 0 0 0 5.7 0l2.6-2.6a4 4 0 1 0-5.7-5.7L8.2 4"/><path d="M11 7a4 4 0 0 0-5.7 0L2.7 9.6a4 4 0 1 0 5.7 5.7L9.8 14"/></g>

    <!-- label + target -->
    <text class="lb31" x="74" y="50">LINKEDIN</text>
    <text class="tg31" x="74" y="68">in/aditya-padmarajan</text>

    <!-- enter arrow -->
    <text class="ar31" x="318" y="65" text-anchor="end">&#8250;</text>

    <!-- hud corners -->
    <g fill="none" stroke="#FF8A3D" stroke-opacity=".45" stroke-width="1.2">
      <path d="M10 22 L10 12 L20 12"/>
      <path d="M320 92 L330 92 L330 82"/>
    </g>

    <!-- overlays -->
    <rect class="sw31" width="340" height="60" fill="url(#swp31)"/>
    <rect width="340" height="104" fill="url(#sc31)"/>
    <rect x="0.5" y="0.5" width="339" height="103" rx="3" fill="none"
